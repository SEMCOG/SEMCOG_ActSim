# trip_mode_choice.yaml

SPEC: trip_mode_choice.csv
COEFFICIENTS: trip_mode_choice_coefficients.csv
COEFFICIENT_TEMPLATE: trip_mode_choice_coefficients_template.csv

LOGIT_TYPE: NL

NESTS:
  name: root
  coefficient: 1.00
  alternatives:
      - name: AUTO
        coefficient: 0.72
        alternatives:
            - DRIVEALONE
            - SHARED2
            - SHARED3
      - name: NONMOTORIZED
        coefficient: 0.72
        alternatives:
          - WALK
          - BIKE
      - name: TRANSIT
        coefficient:  0.72
        alternatives:
            - name: WALKACCESS
              coefficient: 0.5
              alternatives:
              - WALK_LOC
              - WALK_PRM
              - WALK_MIX
            - name: PNRACCESS
              coefficient: 0.5
              alternatives:
              - PNR_LOC
              - PNR_PRM
              - PNR_MIX
            - name: KNRACCESS
              coefficient: 0.5
              alternatives:
              - KNR_LOC
              - KNR_PRM
              - KNR_MIX
      - name: SCHOOL_BUS
        coefficient: 0.72
        alternatives:
          - SCHOOLBUS
      - name: RIDEHAIL
        coefficient: 0.36
        alternatives:
          - TAXI
          - TNC_SINGLE
          - TNC_SHARED

CONSTANTS:
  orig_col_name: origin
  dest_col_name: destination
  I_MODE_MAP:
    DRIVEALONE: 1
    SHARED2: 2
    SHARED3: 3
    WALK: 4
    BIKE: 5
    WALK_LOC: 6
    WALK_PRM: 7
    WALK_MIX: 8
    PNR_LOC: 9
    PNR_PRM: 10
    PNR_MIX: 11
    KNR_LOC: 12
    KNR_PRM: 13
    KNR_MIX: 14
    SCHOOLBUS: 15
    TAXI: 16
    TNC_SINGLE: 17
    TNC_SHARED: 18
  I_SOV_MODES: [1]
  I_SR2_MODES: [2]
  I_SR3P_MODES: [3]
  I_AUTO_MODES: [1, 2, 3]
  I_WALK_MODE: 4
  I_BIKE_MODE: 5
  I_WALK_TRANSIT_MODES: [6,7,8]
  I_DRIVE_TRANSIT_MODES: [9,10,11,12,13,14]
  I_PNR_TRANSIT_MODES: [9,10,11]
  I_KNR_TRANSIT_MODES: [12,13,14]
  I_SCHOOLBUS_MODE: [15]
  I_RIDE_HAIL_MODES: [16, 17, 18]
  density_index_multiplier: -5
  walktimelong_multiplier: 5
  biketimelong_multiplier: 5

# so far, we can use the same spec as for non-joint tours
preprocessor:
  SPEC: trip_mode_choice_annotate_trips_preprocessor
  DF: df
  TABLES:
    - land_use
    - tours
    - persons

#  - SPEC: trip_mode_choice_annotate_trips_preprocessor2
#    DF: df
#    TABLES:
#      - land_use

# to reduce memory needs filter chooser table to these fields
TOURS_MERGED_CHOOSER_COLUMNS:
  - hhsize
  - age
  - auto_ownership
  - number_of_participants
  - tour_category
  - parent_tour_id
  - tour_mode
  - duration
  - value_of_time
  - tour_type
  - free_parking_at_work
  - ptype
  - transit_pass_ownership
  - transit_pass_subsidy



MODE_CHOICE_LOGSUM_COLUMN_NAME: mode_choice_logsum
