# Configs File with Sample Rate set by Model Runner 
inherit_settings: True
# raise error if any sub-process fails without waiting for others to complete
fail_fast: True
# - ------------------------- dev config
multiprocess: True   # True or False
strict: False
mem_tick: 30
use_shadow_pricing: True
memory_profile: False  # True vs False
# sharrow settings
sharrow: True  # True vs False (or require)  
recode_pipeline_columns: True   # True vs False
sharrow_cache_dir: "C:/SEMCOG_ActSim/Sharrow_Cache" # User Defined Paths if not using the default when compiling sharrow
## - example sample
households_sample_size: 0   # 100 vs 0
chunk_size: 0
num_processes: 32    # change the number of processes to 80% of your CPU core count, if less than 40 
chunk_method: hybrid_uss
chunk_training_mode: explicit  # production vs disabled vs explicit
# - tracing
trace_hh_id: 
trace_od:
# to resume after last successful checkpoint, specify resume_after: _
resume_after:
models:
  ### mp_initialize step
  - initialize_landuse
  - initialize_households
  ### mp_accessibility step
  - compute_accessibility
  ### mp_households step
  - school_location
  - university_location_zone_override
  - workplace_location
  - work_from_home
  - transit_pass_subsidy
  - transit_pass_ownership
  - auto_ownership_simulate
  - free_parking
  - telecommute_frequency
  - cdap_simulate
  - mandatory_tour_frequency
  - mandatory_tour_scheduling
  - joint_tour_frequency
  - joint_tour_composition
  - joint_tour_participation
  - joint_tour_destination
  - joint_tour_scheduling
  - non_mandatory_tour_frequency
  - non_mandatory_tour_destination
  - non_mandatory_tour_scheduling
  - tour_mode_choice_simulate
  - atwork_subtour_frequency
  - atwork_subtour_destination
  - atwork_subtour_scheduling
  - atwork_subtour_mode_choice
  - stop_frequency
  - trip_purpose
  - trip_destination
  - trip_purpose_and_destination
  - trip_destination_univ_zone_override
  - parking_location_choice_at_university
  - trip_scheduling
  - stop_frequency_university_parking
  - trip_mode_choice
  ### mp_summarize step
  - write_data_dictionary
  - write_tables
  - write_trip_matrices
multiprocess_steps:  
  - name: mp_initialize
    begin: initialize_landuse
  - name: mp_accessibility
    begin: compute_accessibility
    num_processes: 10
    slice:
      tables:
        - accessibility
      exclude: True
  - name: mp_households
    begin: school_location
    # num_processes: 16
    slice:
      tables:
        - households
        - persons
  - name: mp_summarize
    begin: write_data_dictionary
output_tables:
  action: include
  prefix: final_
  tables:
  - checkpoints
  - tablename: accessibility
    decode_columns:
      zone_id: land_use.zone_id
  - tablename: land_use
    decode_columns:
      zone_id: land_use.zone_id
      TAZ: land_use_taz.TAZ
  - tablename: households
    decode_columns:
      home_zone_id: land_use.zone_id
      TAZ: land_use_taz.TAZ
  - tablename: persons
    decode_columns:
      home_zone_id: land_use.zone_id
      school_zone_id: nonnegative | land_use.zone_id
      workplace_zone_id: nonnegative | land_use.zone_id
      original_school_zone_id: nonnegative | land_use.zone_id
  - tablename: tours
    decode_columns:
      origin: land_use.zone_id
      destination: land_use.zone_id
      univ_parking_zone_id: nonnegative | land_use.zone_id
  - tablename: trips
    decode_columns:
      origin: land_use.zone_id
      destination: land_use.zone_id
      original_school_zone_id: nonnegative | land_use.zone_id
  - tablename: school_shadow_prices
    decode_columns:
      zone_id: land_use.zone_id
  - tablename: workplace_shadow_prices
    decode_columns:
      zone_id: land_use.zone_id
  - joint_tour_participants
# read cached skims (using numpy memmap) from output directory (memmap is faster than omx )
#read_skim_cache: True
# write memmapped cached skims to output directory after reading from omx, for use in subsequent runs
#write_skim_cache: True
